name: BrassPawn
options:
  bundleIdPrefix: com.arte-soft
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BrassPawn:
    path: .

settingGroups: {}

knownRegions:
  - en
  - ar-SA
  - cs
  - da
  - de-DE
  - el
  - en-CA
  - en-US
  - es-ES
  - fi
  - fr-CA
  - fr-FR
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - ms
  - nl-NL
  - no
  - pl
  - pt-BR
  - ro
  - ru
  - sv
  - th
  - tr
  - vi
  - zh-Hans
  - zh-Hant

targets:
  BrassPawn:
    type: application
    platform: iOS
    sources:
      - App
      # The puzzle data is referenced from the repository root rather than
      # copied here. A copy would be 3.4 MB of duplication and, worse, would
      # silently go stale the first time the data is regenerated without
      # remembering to copy it across.
      - path: ../data/tactics.json
        buildPhase: resources
      - path: ../data/positions.json
        buildPhase: resources
      - path: ../data/endgames.json
        buildPhase: resources
      - path: ../data/games.json
        buildPhase: resources
      - path: ../data/classics.json
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
      - path: Resources/Networks
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Localizable.xcstrings
        buildPhase: resources
      - path: App/InfoPlist.xcstrings
        buildPhase: resources
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: BrassPawn
        product: BrassPawnApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Brass Pawn
        # Reading a position off a photograph of a real board. Shown by iOS in
        # its own permission prompt, so it has to say what the camera is for in
        # one line and cannot be evasive about it.
        NSCameraUsageDescription: >-
          To read a chess position from a photo of a real board.
        # The pawn the app is named after, and its name, on the ground the
        # app paints on. Only what is the same in every language goes here: a
        # launch screen cannot be localised, and "Brass Pawn" is the one string
        # that is identical in all thirty-one. The line under it in the menu is
        # translated twenty-seven different ways, so it stays in the menu.
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchGround
          UIImageRespectsSafeAreaInsets: false
        # A phone holds one board and one panel; turning it sideways leaves
        # room for neither. An iPad has room for both side by side, so it turns.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Hidden everywhere, from the launch screen on. A game does not show
        # the time of day, the battery or the signal bars, and this one is a
        # board on a dark ground: the status bar was the only thing on the
        # screen the app had not drawn. Set in the plist rather than per view so
        # it never appears at all — and with the view-controller override off,
        # so no screen can put it back by accident.
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - JetBrainsMono.ttf
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte-soft.brasspawn
        CODE_SIGN_ENTITLEMENTS: App/BrassPawn.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8293TNMX6S
        CODE_SIGN_STYLE: Automatic

schemes:
  BrassPawn:
    build:
      targets:
        BrassPawn: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
