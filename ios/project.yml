name: ChessTrainer
options:
  bundleIdPrefix: com.arte-soft
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ChessTrainer:
    path: .

settingGroups: {}

knownRegions:
  - en
  - ar-SA
  - cs
  - da
  - de-DE
  - el
  - en-CA
  - en-US
  - es-ES
  - fi
  - fr-CA
  - fr-FR
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - ms
  - nl-NL
  - no
  - pl
  - pt-BR
  - ro
  - ru
  - sv
  - th
  - tr
  - vi
  - zh-Hans
  - zh-Hant

targets:
  ChessTrainer:
    type: application
    platform: iOS
    sources:
      - App
      # The puzzle data is referenced from the repository root rather than
      # copied here. A copy would be 3.4 MB of duplication and, worse, would
      # silently go stale the first time the data is regenerated without
      # remembering to copy it across.
      - path: ../data/tactics.json
        buildPhase: resources
      - path: ../data/positions.json
        buildPhase: resources
      - path: ../data/endgames.json
        buildPhase: resources
      - path: ../data/games.json
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
      - path: Resources/Networks
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: ChessTrainer
        product: ChessTrainerApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chess Trainer
        UILaunchScreen: {}
        # A phone holds one board and one panel; turning it sideways leaves
        # room for neither. An iPad has room for both side by side, so it turns.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Hidden everywhere, from the launch screen on. A game does not show
        # the time of day, the battery or the signal bars, and this one is a
        # board on a dark ground: the status bar was the only thing on the
        # screen the app had not drawn. Set in the plist rather than per view so
        # it never appears at all — and with the view-controller override off,
        # so no screen can put it back by accident.
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - JetBrainsMono.ttf
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte-soft.chesstrainer
        CODE_SIGN_ENTITLEMENTS: App/ChessTrainer.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8293TNMX6S
        CODE_SIGN_STYLE: Automatic

schemes:
  ChessTrainer:
    build:
      targets:
        ChessTrainer: all
    run:
      config: Debug
      # Lets the paywall be exercised on a simulator with no App Store account:
      # StoreKit answers from App/ChessTrainer.storekit instead.
      storeKitConfiguration: App/ChessTrainer.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
