name: BrassPawn
options:
  bundleIdPrefix: com.arte-soft
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BrassPawn:
    path: .

settingGroups: {}

knownRegions:
  - en
  - ar-SA
  - cs
  - da
  - de-DE
  - el
  - en-CA
  - en-US
  - es-ES
  - fi
  - fr-CA
  - fr-FR
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - ms
  - nl-NL
  - no
  - pl
  - pt-BR
  - ro
  - ru
  - sv
  - th
  - tr
  - vi
  - zh-Hans
  - zh-Hant

targets:
  BrassPawn:
    type: application
    platform: iOS
    # Before anything else, because the next thing to happen without the
    # networks is three `lstat ... No such file or directory` errors against
    # the resource copy, which name the files and not the reason. They are not
    # committed — 167 MB of build input with a canonical source — and one
    # script fetches them. Saying so here is the difference between a minute
    # and an afternoon on a machine that has just cloned this.
    preBuildScripts:
      - name: Engine networks are present
        basedOnDependencyAnalysis: false
        script: |
          missing=""
          for net in "$SRCROOT/Resources/Networks/reckless.nnue" \
                     "$SRCROOT"/Resources/Networks/nn-*.nnue; do
            [ -f "$net" ] || missing="yes"
          done
          if [ -n "$missing" ]; then
            echo "error: the engine networks are missing. Run: sh ios/scripts/fetch-networks.sh"
            echo "note: they are ~167 MB and are not committed; the script needs nothing but curl."
            exit 1
          fi
    sources:
      - App
      # The puzzle data is referenced from the repository root rather than
      # copied here. A copy would be 3.4 MB of duplication and, worse, would
      # silently go stale the first time the data is regenerated without
      # remembering to copy it across.
      - path: ../data/tactics.json
        buildPhase: resources
      - path: ../data/positions.json
        buildPhase: resources
      - path: ../data/endgames.json
        buildPhase: resources
      - path: ../data/games.json
        buildPhase: resources
      - path: ../data/classics.json
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
      - path: Resources/Networks
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/BoardAssets.xcassets
        buildPhase: resources
      # The Icon Composer document. `type: file` so the generator treats the
      # bundle as one wrapper rather than recursing into it as a group — which
      # is what actool needs in order to compile it as an icon at all.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/Localizable.xcstrings
        buildPhase: resources
      - path: App/InfoPlist.xcstrings
        buildPhase: resources
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: BrassPawn
        product: BrassPawnApp
      # iOS only. There is no such thing as an App Clip on a Mac: nothing
      # invokes one, and the target cannot be built for Catalyst at all, so
      # without the filter the Mac build fails on a dependency it has no use
      # for. The filter is on the dependency and the embed both, which is what
      # `platformFilter` writes.
      - target: BrassPawnClip
        embed: true
        platformFilter: iOS
    info:
      path: App/Info.plist
      properties:
        # Pinned to the build settings rather than left out. XcodeGen writes
        # a literal CFBundleVersion of 1 when nothing says otherwise, and the
        # Info.plist beats CURRENT_PROJECT_VERSION — so bumping the setting
        # alone changed nothing, and an archive went out numbered the same as
        # the build already uploaded.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Brass Pawn
        # brasspawn://today/<id>: how a story page on the site opens the same
        # story in the app, through Safari's app banner or its "Open in Brass
        # Pawn" button. A scheme rather than a universal link because a
        # universal link needs the Associated Domains capability on the App ID,
        # and this needs nothing from the portal.
        CFBundleURLTypes:
          - CFBundleURLName: com.arte-soft.brasspawn
            CFBundleURLSchemes:
              - brasspawn
        # Reading a position off a photograph of a real board. Shown by iOS in
        # its own permission prompt, so it has to say what the camera is for in
        # one line and cannot be evasive about it.
        NSCameraUsageDescription: >-
          To read a chess position from a photo of a real board.
        UILaunchStoryboardName: LaunchScreen
        # A phone holds one board and one panel; turning it sideways leaves
        # room for neither. An iPad has room for both side by side, so it turns.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Which shelf the Mac App Store puts it on. Required there and only
        # there: on iOS the category is a field in App Store Connect and the
        # bundle says nothing, so this was missing until a Mac archive refused
        # validation over it. Board games rather than strategy — the thing being
        # sold is a board. Not given to the App Clip, which is iOS only.
        LSApplicationCategoryType: public.app-category.board-games
        # Hidden everywhere, from the launch screen on. A game does not show
        # the time of day, the battery or the signal bars, and this one is a
        # board on a dark ground: the status bar was the only thing on the
        # screen the app had not drawn. Set in the plist rather than per view so
        # it never appears at all — and with the view-controller override off,
        # so no screen can put it back by accident.
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - JetBrainsMono.ttf
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte-soft.brasspawn
        CODE_SIGN_ENTITLEMENTS: App/BrassPawn.entitlements
        # The Mac wants a different set. App Sandbox is not optional for a Mac
        # App Store build, and the App Group is an iOS arrangement — the clip
        # that used it does not exist here. See App/BrassPawnCatalyst.entitlements.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/BrassPawnCatalyst.entitlements
        MARKETING_VERSION: "1.2"
        # Carried on rather than restarted at 1. App Store Connect wants the
        # build number unique within a marketing version, so 1 would have been
        # legal — but 1.0 (2) is already uploaded for the Mac, and a sequence
        # that only ever goes up is one fewer thing to reason about when two
        # platforms are drawing from the same record.
        #
        # 6, on both platforms: App Store Connect has iOS at 5 and the Mac at 4,
        # and one above the higher of the two keeps the sequence rising on both
        # without anybody having to remember which platform was where. It was
        # meant for 1.1.1, which was never uploaded; it went out as 1.2, the
        # version with Today in it.
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        # 6 is the Mac. Its presence is what asks for the Mac idiom — native
        # control metrics and a window drawn at its own scale — rather than an
        # iPad screen shrunk to 77% and left slightly soft. The app draws nearly
        # all of its own furniture, so there is little of UIKit's to be resized
        # by the change, and the board is the one thing that gains from every
        # pixel being its own.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        # And not the other Mac. Xcode offers "Mac (Designed for iPad)" by
        # default — the iPad build run under compatibility — and it was showing
        # in Supported Destinations beside the Catalyst one. A Catalyst app is
        # not eligible for it, so the pair was a contradiction rather than a
        # choice: two Macs listed, only one of which can happen.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Apple silicon only. The generic Catalyst destination an archive builds
        # against is "arm64, x86_64", so without this it compiles an Intel half
        # and fails at the link on the engine, which is built for one
        # architecture — at the end of a long Release build, on the one step
        # nobody runs until they are shipping. macOS 26 is the last release to
        # carry Intel at all, and this app's floor is macOS 14.
        ARCHS[sdk=macosx*]: arm64
        # The same bundle identifier on both, so the Mac build is the same
        # product as the iOS one: one App Store listing, one universal purchase,
        # and a subscription bought on a phone that is already paid for here.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Resources/AppIcon.icon, not the appiconset of the same name. Both
        # exist; the document wins because actool prefers it, and it is what
        # gives iOS 26 the light, dark and tinted appearances.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8293TNMX6S
        CODE_SIGN_STYLE: Automatic

  # Six tactics, and a button to the App Store. No engine — the smallest
  # network alone is a hundred megabytes, and the whole clip has to fit in
  # that. What it does carry is the real board, which is why BoardUI exists.
  BrassPawnClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Clip
      # Six positions rather than fourteen thousand: 2 KB instead of 3.4 MB,
      # and an order that was chosen rather than drawn.
      - path: ../data/clip-tactics.json
        buildPhase: resources
      # The same catalogue the app compiles, so the clip speaks all thirty-one
      # languages without a second set of translations to keep in step. Only
      # the handful of keys it looks up are ever read.
      - path: App/Localizable.xcstrings
        buildPhase: resources
      - path: App/InfoPlist.xcstrings
        buildPhase: resources
      # The pieces and the board, shared with the app rather than copied. Kept
      # in a catalogue of their own precisely so the clip can take them without
      # the app's icons and launch art: those were seventeen of the clip's
      # twenty-three megabytes, and a clip is downloaded while somebody waits.
      - path: Resources/BoardAssets.xcassets
        buildPhase: resources
      # Only the display face, and only for the name at the top: the clip has
      # no settings to change the typeface with, so the other two would be
      # nearly two megabytes nobody ever sees.
      - path: Resources/Fonts/CormorantGaramond.ttf
        buildPhase: resources
      # The same icon document as the app. A clip that arrives wearing a
      # different face is a different app as far as anybody looking at it is
      # concerned.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: BrassPawn
        product: BoardUI
    info:
      path: Clip/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Brass Pawn
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        UILaunchScreen:
          UIColorName: ClipLaunch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # All four on iPad, matching the app. A bundle that runs on iPad has to
        # take every orientation or it cannot be a multitasking citizen, and
        # the store refuses it outright — which is what happened. The clip is
        # laid out for portrait and simply lets the board find its width.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # XcodeGen writes this for an ordinary application and not for an App
        # Clip, and the store wants APPL from both.
        CFBundlePackageType: APPL
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - CormorantGaramond.ttf
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte-soft.brasspawn.Clip
        CODE_SIGN_ENTITLEMENTS: Clip/BrassPawnClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2"
        # Carried on rather than restarted at 1. App Store Connect wants the
        # build number unique within a marketing version, so 1 would have been
        # legal — but 1.0 (2) is already uploaded for the Mac, and a sequence
        # that only ever goes up is one fewer thing to reason about when two
        # platforms are drawing from the same record.
        #
        # 6, on both platforms: App Store Connect has iOS at 5 and the Mac at 4,
        # and one above the higher of the two keeps the sequence rising on both
        # without anybody having to remember which platform was where. It was
        # meant for 1.1.1, which was never uploaded; it went out as 1.2, the
        # version with Today in it.
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Said out loud rather than left to the default, because the app beside
        # it now says YES and a reader would otherwise have to know which way
        # the default falls.
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 8293TNMX6S
        CODE_SIGN_STYLE: Automatic


schemes:
  BrassPawn:
    build:
      targets:
        BrassPawn: all
  BrassPawnClip:
    build:
      targets:
        BrassPawnClip: all
    run:
      config: Debug
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
