name: ChessTrainer
options:
  bundleIdPrefix: com.arte-soft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ChessTrainer:
    path: .

targets:
  ChessTrainer:
    type: application
    platform: iOS
    sources:
      - App
      # The puzzle data is referenced from the repository root rather than
      # copied here. A copy would be 3.4 MB of duplication and, worse, would
      # silently go stale the first time the data is regenerated without
      # remembering to copy it across.
      - path: ../data/tactics.json
        buildPhase: resources
      - path: ../data/positions.json
        buildPhase: resources
      - path: ../data/endgames.json
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
      - path: Resources/Networks
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ChessTrainer
        product: ChessTrainerApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chess Trainer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte-soft.chesstrainer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8293TNMX6S
        CODE_SIGN_STYLE: Automatic
