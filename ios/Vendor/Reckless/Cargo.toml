[package]
name = "reckless"
version = "0.10.0-dev"
edition = "2024"
build = "build/build.rs"
publish = false

[lib]
# staticlib added for embedding: iOS links the engine into the app binary.
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# `embedded-network` is on by default so that building this crate on its own is
# unchanged: the engine compiles its network in and needs no file beside it.
#
# The iOS app turns it off — it builds with --no-default-features — because the
# network is 60 MB and a static library carries it twice, once as data and once
# inside the bitcode LTO emits. Four platform slices of that is 564 MB of build
# output that cannot go anywhere near a git repository. Off, the library is
# 11 MB and the app loads the same network from its bundle at start-up, exactly
# as it already does for Stockfish. See bridge/include/reckless.h.
default = ["syzygy", "embedded-network"]
syzygy = []
embedded-network = []
spsa = []

[profile.dev]
opt-level = 3
debug = true
debug-assertions = true

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[build-dependencies]
cc = "1.2.19"
bindgen = "0.71.1"

[dependencies]
libc = "0.2.175"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
