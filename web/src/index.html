<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brass Pawn — the training half of getting good</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Brass Pawn for iPhone and iPad: tactics, positional judgement, endgame technique and coached play, with two chess engines running on the device. Nothing leaves the phone."
    />
    <!--
      Three sizes rather than one, and no SVG.

      Chrome and Firefox prefer an SVG icon over every PNG offered, so keeping
      the old vector pawn here would mean the new icon never appeared. And a
      browser given one size scales it itself, badly: the 16 is a different
      crop from the 48, not the same picture shrunk, because at sixteen pixels
      the board the piece stands on is four dark smudges.
    -->
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <!-- Square and opaque on purpose: iOS rounds it itself, and an icon that
         arrives pre-rounded is rounded twice. -->
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!--
      The largest thing on the first screen is the title, set in Cormorant
      Garamond light with an italic second line. Those two files are preloaded
      by name; the rest of the family and the other two faces come through the
      stylesheet, because preloading everything would put nine fonts ahead of
      the content and make the metric worse rather than better.

      They are served from this origin, so there is no third-party DNS lookup
      and no TLS handshake in front of the first paint — and nothing about a
      visitor is handed to anyone to draw a heading.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/cormorant-garamond-300-latin.5d618c46.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/cormorant-garamond-400-italic-latin.c80b489f.woff2"
      crossorigin
    />
  </head>
  <body>
    <bp-root></bp-root>
    <noscript>
      <div class="noscript">
        <h1>Brass Pawn</h1>
        <p>
          This site uses JavaScript for its title sequence. The words matter more than the pictures,
          so here they are: Brass Pawn is a chess training app for iPhone and iPad — tactics,
          positional judgement, endgame technique and coached play, with two chess engines running
          on the device. It collects nothing and sends nothing.
        </p>

          <a href="privacy">Privacy Policy</a> · <a href="terms">Terms of Service</a> ·
          <a href="licences">Licences</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
